name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Publish (self-contained, one exe — no .NET install needed)
        run: >
          dotnet publish src/Wallflow/Wallflow.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -p:DebugType=none -o out/full

      - name: Publish (fast-start variant — ReadyToRun, not compressed)
        run: >
          dotnet publish src/Wallflow/Wallflow.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishReadyToRun=true
          -p:DebugType=none -o out/fast

      - name: Publish (lite — needs .NET 8 Desktop Runtime)
        run: >
          dotnet publish src/Wallflow/Wallflow.csproj -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true -p:DebugType=none -o out/lite

      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item out/fast/Wallflow.exe dist/Wallflow.exe
          Copy-Item out/full/Wallflow.exe dist/Wallflow-compact.exe
          Copy-Item out/lite/Wallflow.exe dist/Wallflow-lite.exe
          Get-ChildItem dist | Format-Table Name, Length

      - name: Smoke test (start, open gallery, check for crashes, measure RAM)
        shell: pwsh
        run: |
          $exe = (Resolve-Path dist/Wallflow.exe).Path
          $log = "$env:APPDATA\Wallflow\error.log"
          Remove-Item -Recurse -Force "$env:APPDATA\Wallflow" -ErrorAction SilentlyContinue
          $p = Start-Process $exe -ArgumentList '--tray' -PassThru
          Start-Sleep 25
          if ($p.HasExited) { Write-Error "Wallflow exited on startup (code $($p.ExitCode))"; if (Test-Path $log) { Get-Content $log }; exit 1 }
          $p.Refresh(); "RAM after start (settings window open): {0:N0} MB" -f ($p.WorkingSet64/1MB)
          Start-Process $exe | Out-Null          # second instance -> asks the first to open the gallery
          Start-Sleep 25
          $p.Refresh(); "RAM with gallery loaded: {0:N0} MB" -f ($p.WorkingSet64/1MB)
          if ($p.HasExited) { Write-Error "Wallflow crashed after opening gallery"; if (Test-Path $log) { Get-Content $log }; exit 1 }
          Get-Process Wallflow | Format-Table Id, @{n='MB';e={[int]($_.WorkingSet64/1MB)}}, MainWindowTitle
          if (Test-Path $log) { "---- error.log ----"; Get-Content $log }
          "---- startup ----"; Get-Content "$env:APPDATA\Wallflow\startup.log" -ErrorAction SilentlyContinue
          "---- autostart ----"; schtasks /Query /TN Wallflow /V /FO LIST | Select-String "TaskName|Task To Run|Status|Logon Mode"
          if (Test-Path "$env:APPDATA\Wallflow\settings.json") { "---- folders found ----"; (Get-Content "$env:APPDATA\Wallflow\settings.json" | ConvertFrom-Json).Folders | ForEach-Object { "$($_.Name): $($_.Items.Count)" } }
          Stop-Process -Id $p.Id -Force
          if (Test-Path $log) { Write-Error "error.log is not empty"; exit 1 }

      - name: Screenshot of widgets on a test wallpaper
        shell: pwsh
        continue-on-error: true
        run: |
          Add-Type -AssemblyName System.Drawing, System.Windows.Forms
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          "Screen: $($b.Width)x$($b.Height)"
          # colourful test wallpaper
          $bmp = New-Object System.Drawing.Bitmap 1920, 1080
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $br = New-Object System.Drawing.Drawing2D.LinearGradientBrush ([System.Drawing.Point]::new(0,0)), ([System.Drawing.Point]::new(1920,1080)), ([System.Drawing.Color]::FromArgb(255,40,10,90)), ([System.Drawing.Color]::FromArgb(255,0,160,200))
          $g.FillRectangle($br, 0, 0, 1920, 1080)
          for ($i = 0; $i -lt 40; $i++) { $c = [System.Drawing.Color]::FromArgb(255, (Get-Random 255), (Get-Random 120), 255); $g.FillEllipse((New-Object System.Drawing.SolidBrush $c), (Get-Random 1800), (Get-Random 1000), 140, 140) }
          $wp = "$env:RUNNER_TEMP\wp.jpg"; $bmp.Save($wp, [System.Drawing.Imaging.ImageFormat]::Jpeg)
          Add-Type 'using System.Runtime.InteropServices; public class W { [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern bool SystemParametersInfo(int a,int b,string c,int d); }'
          [W]::SystemParametersInfo(20, 0, $wp, 3) | Out-Null
          # a few shortcuts on the desktop
          $desk = [Environment]::GetFolderPath('Desktop'); $sh = New-Object -ComObject WScript.Shell
          foreach ($n in 'Steam','Telegram','Discord','Spotify','OBS Studio','Visual Studio Code','Notepad++','Blender') { $l = $sh.CreateShortcut("$desk\$n.lnk"); $l.TargetPath = "C:\Windows\System32\notepad.exe"; $l.Save() }
          Remove-Item -Recurse -Force "$env:APPDATA\Wallflow" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "$env:APPDATA\Wallflow" | Out-Null
          Set-Content "$env:APPDATA\Wallflow\settings.json.seen" "ci"
          # a real NASA clip for the live wallpaper test
          $video = ""
          try {
            $hit = (Invoke-RestMethod "https://images-api.nasa.gov/search?q=earth%20from%20space&media_type=video&page_size=5").collection.items[0].data[0].nasa_id
            $files = (Invoke-RestMethod "https://images-api.nasa.gov/asset/$([uri]::EscapeDataString($hit))").collection.items.href | Where-Object { $_ -like '*.mp4' }
            $url = ($files | Where-Object { $_ -like '*~small.mp4' } | Select-Object -First 1); if (-not $url) { $url = $files | Select-Object -First 1 }
            $video = "$env:RUNNER_TEMP\live.mp4"; Invoke-WebRequest ($url -replace '^http:', 'https:') -OutFile $video
            "NASA clip: $hit -> $url ($((Get-Item $video).Length) bytes)"
          } catch { "NASA download failed: $_"; $video = "" }
          $cfg = @{
            Widgets = @{ Player = $true; Todo = $true; ClockStyle = "outline"; ClockGradient = $true; GradientFrom = "#FF2D95"; GradientTo = "#00E5FF"; ShowSeconds = $true;
                         Notes = @(@{ Title = "Покупки"; Text = "Молоко`nХлеб`nКофе"; Color = "#FF7AC6"; FontSize = 17; Width = 240 });
                         TodoTitle = "Сегодня"; TodoFontSize = 16; TodoSpacing = 6; TodoDoneToBottom = $false;
                         TodoItems = @(@{ Text = "Поставить живые обои"; Done = $true }, @{ Text = "Настроить док"; Done = $false }, @{ Text = "Выбрать градиент"; Done = $false }) }
            HideDesktopIcons = $true
            Live = @{ Enabled = [bool]$video; File = $video; Title = "NASA test" }
          }
          $cfg | ConvertTo-Json -Depth 10 | Set-Content "$env:APPDATA\Wallflow\settings.json" -Encoding UTF8
          $p = Start-Process (Resolve-Path dist/Wallflow.exe).Path -ArgumentList '--tray' -PassThru
          Start-Sleep 25
          (New-Object -ComObject Shell.Application).MinimizeAll()
          Start-Sleep 4
          New-Item -ItemType Directory -Force shots | Out-Null
          function Shot($name) { $s = New-Object System.Drawing.Bitmap $b.Width, $b.Height; $gg = [System.Drawing.Graphics]::FromImage($s); $gg.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size); $s.Save("shots\$name.png"); }
          Shot "desktop"
          Start-Sleep 3
          Shot "desktop2"
          Start-Process (Resolve-Path dist/Wallflow.exe).Path | Out-Null
          Start-Sleep 15
          Shot "gallery"
          $p.Refresh(); "RAM with video wallpaper + gallery: {0:N0} MB" -f ($p.WorkingSet64/1MB)
          Stop-Process -Id $p.Id -Force
          Start-Sleep 2
          Remove-Item "$env:APPDATA\Wallflow\settings.json.seen"
          $p = Start-Process (Resolve-Path dist/Wallflow.exe).Path -ArgumentList '--tray' -PassThru
          Start-Sleep 15
          Shot "settings"
          Stop-Process -Id $p.Id -Force
          if (Test-Path "$env:APPDATA\Wallflow\live.log") { "---- live.log ----"; Get-Content "$env:APPDATA\Wallflow\live.log" | Select-Object -Last 120 }
          if (Test-Path "$env:APPDATA\Wallflow\error.log") { "---- error.log ----"; Get-Content "$env:APPDATA\Wallflow\error.log" }

      - name: User-guide screenshots (RU + EN)
        if: github.event_name == 'push'
        continue-on-error: true
        shell: pwsh
        run: |
          Add-Type @"
          using System; using System.Runtime.InteropServices;
          public class Res {
            [StructLayout(LayoutKind.Sequential, CharSet=CharSet.Ansi)]
            public struct DEVMODE { [MarshalAs(UnmanagedType.ByValTStr,SizeConst=32)] public string dmDeviceName; public short dmSpecVersion, dmDriverVersion, dmSize, dmDriverExtra; public int dmFields; public int dmPositionX, dmPositionY, dmDisplayOrientation, dmDisplayFixedOutput; public short dmColor, dmDuplex, dmYResolution, dmTTOption, dmCollate; [MarshalAs(UnmanagedType.ByValTStr,SizeConst=32)] public string dmFormName; public short dmLogPixels; public int dmBitsPerPel, dmPelsWidth, dmPelsHeight, dmDisplayFlags, dmDisplayFrequency, dmICMMethod, dmICMIntent, dmMediaType, dmDitherType, dmReserved1, dmReserved2, dmPanningWidth, dmPanningHeight; }
            [DllImport("user32.dll")] public static extern int EnumDisplaySettings(string d, int m, ref DEVMODE dm);
            [DllImport("user32.dll")] public static extern int ChangeDisplaySettings(ref DEVMODE dm, int f);
            public static int Set(int w, int h) { var dm = new DEVMODE(); dm.dmSize = (short)Marshal.SizeOf(dm); EnumDisplaySettings(null, -1, ref dm); dm.dmPelsWidth = w; dm.dmPelsHeight = h; dm.dmFields = 0x80000 | 0x100000; return ChangeDisplaySettings(ref dm, 0); }
          }
          "@
          foreach ($r in @(@(1920,1080), @(1600,900), @(1280,1024))) { $res = [Res]::Set($r[0], $r[1]); "resolution $($r[0])x$($r[1]) -> $res"; if ($res -eq 0) { break } }
          Start-Sleep 3
          Add-Type -AssemblyName System.Windows.Forms
          "screen now: $([System.Windows.Forms.Screen]::PrimaryScreen.Bounds)"

          # a real wallpaper from Wallhaven
          $wp = "$env:RUNNER_TEMP\guide-wall.jpg"
          try {
            $hit = (Invoke-RestMethod "https://wallhaven.cc/api/v1/search?q=landscape&categories=100&purity=100&sorting=toplist&topRange=1y&atleast=1920x1080&ratios=16x9").data[2]
            Invoke-WebRequest $hit.path -OutFile $wp
            Add-Type 'using System.Runtime.InteropServices; public class W2 { [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern bool SystemParametersInfo(int a,int b,string c,int d); }'
            [W2]::SystemParametersInfo(20, 0, $wp, 3) | Out-Null
            "wallpaper: $($hit.path)"
          } catch { "wallpaper download failed: $_" }

          # real program shortcuts instead of the test ones
          $desk = [Environment]::GetFolderPath('Desktop'); Get-ChildItem $desk -Filter *.lnk | Remove-Item -Force
          Get-ChildItem $desk | Where-Object { $_.Extension -ne '.lnk' } | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          $sh = New-Object -ComObject WScript.Shell
          $apps = @{ 'Notepad' = "$env:WINDIR\System32\notepad.exe"; 'PowerShell' = "$env:ProgramFiles\PowerShell\7\pwsh.exe"; 'File Explorer' = "$env:WINDIR\explorer.exe";
                     'Task Manager' = "$env:WINDIR\System32\Taskmgr.exe"; 'Control Panel' = "$env:WINDIR\System32\control.exe"; 'Command Prompt' = "$env:WINDIR\System32\cmd.exe" }
          foreach ($k in $apps.Keys) { if (Test-Path $apps[$k]) { $l = $sh.CreateShortcut("$desk\$k.lnk"); $l.TargetPath = $apps[$k]; $l.Save() } }

          foreach ($lang in "ru", "en") {
            Remove-Item -Recurse -Force "$env:APPDATA\Wallflow" -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force "$env:APPDATA\Wallflow" | Out-Null
            Set-Content "$env:APPDATA\Wallflow\settings.json.seen" "ci"
            if ($lang -eq "ru") {
              $note = @{ Title = "Покупки"; Text = "Молоко`nХлеб`nКофе"; Color = "#FF7AC6"; FontSize = 16 }
              $todo = @(@{ Text = "Поставить обои"; Done = $true }, @{ Text = "Расставить виджеты"; Done = $false }, @{ Text = "Выбрать стиль часов"; Done = $false })
              $todoTitle = "Сегодня"
            } else {
              $note = @{ Title = "Groceries"; Text = "Milk`nBread`nCoffee"; Color = "#FF7AC6"; FontSize = 16 }
              $todo = @(@{ Text = "Set a wallpaper"; Done = $true }, @{ Text = "Arrange widgets"; Done = $false }, @{ Text = "Pick a clock style"; Done = $false })
              $todoTitle = "Today"
            }
            $cfg = @{
              UiLanguage = $lang; HideDesktopIcons = $true; IconsDefaultApplied = $true; AutoStart = $false
              Widgets = @{ Language = $lang; ClockStyle = "poster"; ClockGradient = $true; GradientFrom = "#FFFFFF"; GradientTo = "#9FD8FF"; Player = $true; Todo = $true;
                           City = "Tashkent"; Notes = @($note); TodoItems = $todo; TodoTitle = $todoTitle; TodoDoneToBottom = $false }
            }
            $cfg | ConvertTo-Json -Depth 10 | Set-Content "$env:APPDATA\Wallflow\settings.json" -Encoding UTF8
            $out = (Join-Path (Get-Location) "shots\guide-$lang")
            New-Item -ItemType Directory -Force $out | Out-Null
            $p = Start-Process (Resolve-Path dist/Wallflow.exe).Path -ArgumentList '--tray', '--tour', "`"$out`"" -PassThru
            (New-Object -ComObject Shell.Application).MinimizeAll()
            foreach ($i in 1..60) { if (Test-Path "$out\done.txt") { break }; Start-Sleep 3 }
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
            "guide-$lang: $((Get-ChildItem $out -Filter *.png).Count) screenshots"
            if (Test-Path "$env:APPDATA\Wallflow\error.log") { Get-Content "$env:APPDATA\Wallflow\error.log" }
          }

      - name: Publish screenshots to the ci-screenshots branch
        if: github.event_name == 'push'
        continue-on-error: true
        shell: pwsh
        run: |
          $dst = "$env:RUNNER_TEMP\shotsrepo"
          git init -q $dst
          Copy-Item shots\* $dst -Recurse
          git -C $dst add -A
          git -C $dst -c user.name=ci -c user.email=ci@local commit -q -m "screenshots $env:GITHUB_SHA"
          git -C $dst push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:ci-screenshots

      - uses: actions/upload-artifact@v4
        with:
          name: Wallflow-windows-x64
          path: dist/*.exe
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
